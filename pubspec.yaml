name: fit_street
description: "A new Flutter project."
publish_to: 'none'
version: 5.0.0+5

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI / utilities
  google_fonts: ^6.3.2
  liquid_swipe: ^3.1.0
  gradient_borders: ^1.0.2
  glass: ^2.0.0+2
  glassmorphism: ^3.0.0
  liquid_glass_renderer: 0.2.0-dev.4
  url_launcher: ^6.3.2

  # Media / files
  image_picker: ^1.2.1
  file_picker: ^10.3.7
  mime: ^2.0.0
  path: ^1.9.1
  dio: ^5.9.0
  flutter_secure_storage: ^9.2.4
  flutter_image_compress: ^2.4.0
  path_provider: ^2.1.5

  # Signature / storage / i18n
  signature: ^6.3.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  razorpay_flutter: ^1.4.0

  # Networking & state
  http: ^1.6.0
  provider: ^6.1.5+1

  # Misc
  flutter_spinkit: ^5.2.2
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.2
  magnifying_glass: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/image/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/image/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/image/



